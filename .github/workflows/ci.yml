name: Python CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:

    runs-on: windows-latest

    steps:

    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Mostrar versión
      run: python --version

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Revisar código con Ruff
      run: |
        ruff check .
    
    - name: Verificar formato
      run:  |
        ruff format . --check

    - name: Verificar sintaxis
      run: |
        python -m compileall .